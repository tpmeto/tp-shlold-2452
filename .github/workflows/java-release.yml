name: java:release
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USER: "tp-robot"

permissions:
  contents: write
  actions: read

concurrency:
  group: java-release
  cancel-in-progress: false

jobs:
  build:
    name: java-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check for Java changes
        id: java_changes
        shell: bash
        run: |
          git fetch origin main --depth=2
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'java/**' | grep . || true)
          if [ -z "$CHANGED" ]; then
            echo "No Java files changed. Skipping workflow."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Lock PRs
        id: lock_prs
        if: steps.java_changes.outputs.changed == 'true'
        shell: bash
        run: |
            echo "Locking other PRs..."
            PRS=$(gh pr list --state open --json number --jq '.[].number')
            for pr in $PRS; do
                echo "Locking PR #$pr"
                gh pr edit $pr --add-label "do-not-merge"
            done

      - name: Release Java applications
        id: java_release
        if: steps.java_changes.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Releasing Java applications..."
          
          # sleep for 1m
          echo "Sleeping for 1 minutes to simulate work."
          sleep 60
          
          # ensure we are using the latest code from main
          git pull origin main
          
          # increment the version number in the version.properties file
          VERSION_FILE="java/version.properties"
          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(cat $VERSION_FILE)
            echo "Current version: $CURRENT_VERSION"
            IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]}
            PATCH=${VERSION_PARTS[2]}
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "New version: $NEW_VERSION"
            echo "$NEW_VERSION" > $VERSION_FILE
          else
            echo "0.1.0" > $VERSION_FILE
            echo "Version file not found. Starting with version 0.1.0"
          fi
          
          # commit the version change
          git config --local user.name $GITHUB_USER
          git add $VERSION_FILE
          git commit -m "Release Java applications - version $NEW_VERSION"
          git push origin HEAD:main
          
          echo "Java Release complete..."

      - name: Unlock PRs
        id: unlock_prs
        if: steps.java_changes.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Unlocking other PRs..."
          PRS=$(gh pr list --state open --json number --jq '.[].number')
          for pr in $PRS; do
              echo "Unlocking PR #$pr"
              gh pr edit $pr --remove-label "do-not-merge"
          done
          